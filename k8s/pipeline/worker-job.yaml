# Two (or more) workers run at the same time. The Indexed Job gives each Pod a different index,
# which becomes SHARD_INDEX (0, 1, ...). SHARD_COUNT must equal `completions`.
apiVersion: batch/v1
kind: Job
metadata: {name: teacher-labelling, namespace: pipeline}
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: parser-worker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              valueFrom:
                fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: OLLAMA_URL, value: "http://host.k3d.internal:11434"}
            - {name: TEACHER_MODEL, value: "phi3.5"}
          envFrom:
            - secretRef: {name: s3-credentials}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
